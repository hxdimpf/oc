# Deployed to /opt/stacks/npm/ by ansible/deploy.yml.
name: npm
services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports: ["80:80", "443:443", "81:81"]
    volumes: [npm_data:/data, npm_letsencrypt:/etc/letsencrypt]
    networks: [oc]
volumes:
  npm_data:
  npm_letsencrypt:
networks:
  oc:
    external: true
